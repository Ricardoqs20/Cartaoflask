<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ perfil.nome }} - {{ perfil.corretora }}</title>
    <!-- Atualizei a versão do CSS para garantir que o navegador leia o novo arquivo -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=12">
    
    <!-- Font Awesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="card-container">
        
        <!-- Header (Foto com degradê vinho e corte arredondado) -->
        <header class="hero-section" style="--bg-url: url('{{ url_for('static', filename=perfil.foto) }}');">
            
            <div class="top-bar">
                <!-- Logo RE/MAX DREAMS com a imagem do balão -->
                <div class="logo-remax">
                    <img src="{{ url_for('static', filename='balao.png') }}" alt="Balão RE/MAX" class="custom-balloon">
                    <div class="logo-text">
                        <strong class="red-text">RE<span class="slash">/</span>MAX</strong>
                        <small class="blue-text">DREAMS</small>
                    </div>
                </div>
                <!-- O botão de menu foi removido -->
            </div>

            <!-- Textos laterais -->
            <div class="profile-info">
                <h1>Conceição<br>Queiroz</h1>
                <div class="gold-line"></div>
                <p>{{ perfil.subtitulo }}</p>
            </div>
        </header>

        <!-- Seção de Imóveis -->
        <main class="content-section">
            <div class="section-title">
                <i class="fa-solid fa-house"></i>
                <h2>Imóveis disponíveis</h2>
            </div>

            <div class="property-grid">
                {% for imovel in imoveis %}
                <div class="property-card" style="background-image: url('{{ imovel.imagem }}');">
                    <div class="card-overlay">
                        <h3>{{ imovel.titulo }}</h3>
                        <div class="card-divider"></div>
                        <p class="price">{{ imovel.preco }}</p>
                        <p class="location">{{ imovel.localizacao }}</p>
                        <a href="{{ imovel.link }}" class="arrow-btn" aria-label="Ver {{ imovel.titulo }}">
                            <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
                {% endfor %}
            </div>
        </main>

        <!-- Rodapé de Ações -->
        <footer class="action-bar">
            <a href="https://wa.me/5598991936778" target="_blank" class="action-item">
                <i class="fa-brands fa-whatsapp icon"></i>
                <span>WhatsApp</span>
            </a>
            
            <div class="vertical-divider"></div>
            
            <a href="https://www.instagram.com/conceicaoqueirozz_/" target="_blank" class="action-item">
                <i class="fa-brands fa-instagram icon"></i>
                <span>Instagram</span>
            </a>
            
            <div class="vertical-divider"></div>
            
            <a href="https://www.remax.com.br/conceicaoqueiroz" target="_blank" class="action-item">
                <i class="fa-solid fa-globe icon"></i>
                <span>Website</span>
            </a>
            
            <div class="vertical-divider"></div>
            
            <a href="#" class="action-item">
                <i class="fa-solid fa-share-nodes icon"></i>
                <span>Compartilhar</span>
            </a>
        </footer>

    </div>
</body>
</html>
