<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- ESSA LINHA ABAIXO BLOQUEIA O IPHONE DE TRANSFORMAR NÚMEROS EM LINKS AZUIS -->
    <meta name="format-detection" content="telephone=no">
    <title>Painel Administrativo</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; padding: 15px; margin: 0; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #5c181b; text-align: center; font-size: 20px; margin-bottom: 20px; }
        
        .btn-add { display: block; width: 100%; padding: 15px; background: #5c181b; color: white; text-align: center; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 20px; }
        
        .imovel-card { display: flex; align-items: center; background: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; }
        .imovel-img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; margin-right: 15px; }
        .imovel-info { flex-grow: 1; }
        .imovel-titulo { font-weight: bold; color: #333; margin: 0 0 5px 0; font-size: 15px; }
        
        /* Forçamos a cor e tiramos qualquer estilo de link que o navegador tente empurrar */
        .imovel-preco { color: #5c181b !important; font-size: 14px; font-weight: bold; margin: 0; text-decoration: none !important; }
        
        .acoes { display: flex; flex-direction: column; gap: 5px; }
        .btn-acao { padding: 6px 12px; border-radius: 4px; font-size: 12px; text-decoration: none; text-align: center; font-weight: bold; }
        .btn-editar { background: #e0e0e0; color: #333; }
        .btn-excluir { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h1>Meus Imóveis</h1>
    
    <!-- Rota corrigida para /admin/adicionar -->
    <a href="/admin/adicionar" class="btn-add">+ Adicionar Novo Imóvel</a>

    {% for imovel in imoveis %}
    <div class="imovel-card">
        <img src="/static/{{ imovel.imagem }}" class="imovel-img" alt="Foto">
        <div class="imovel-info">
            <p class="imovel-titulo">{{ imovel.titulo }}</p>
            <!-- O comando abaixo formata o número automaticamente colocando os pontos de milhar -->
            <p class="imovel-preco">R$ {{ "{:,.0f}".format(imovel.preco_num | float).replace(',', '.') }}</p>
        </div>
        <div class="acoes">
            <a href="/admin/editar/{{ imovel.id }}" class="btn-acao btn-editar">Editar</a>
            <a href="/admin/excluir/{{ imovel.id }}" class="btn-acao btn-excluir" onclick="return confirm('Tem certeza?')">Excluir</a>
        </div>
    </div>
    {% endfor %}
</div>

</body>
</html>
